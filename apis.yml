aid: inyad
name: Inyad
description: 'Inyad is an all-in-one business management and payments platform for
  small and medium businesses across Morocco, the Middle East, and Africa. Its mobile-first
  apps let merchants sell, get paid, and run their operations from one place — including
  a smart point-of-sale (POS Mahaal), automatic invoicing, an online store builder,
  employee attendance and payroll (Staff), a digital credit book (Konnash), in-store
  card terminals and terminal-free digital collection (Collect), professional business
  accounts, and money-transfer services. The company reports 250,000+ professionals
  on the platform and is backed by investors including Partech, Al Mada Ventures, CDG
  Invest, and FJ Labs. Inyad exposes an internal application backend (api.inyad.com)
  but publishes no public developer API, documentation, or SDKs at this time.'
